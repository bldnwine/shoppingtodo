<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5"/>
  <title>Team Shopping List</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#e8cc54" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="./icons/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0f0f11;
      --surface: #17171c;
      --card: #17171c;
      --card-hover: #1e1e24;
      --input-bg: #121216;
      --text: #e1e1ee;
      --text-secondary: #a0a0b0;
      --text-dim: #606070;
      --accent: #e8cc54;
      --accent-hover: #f0d86a;
      --accent-dim: rgba(232, 204, 84, 0.12);
      --success: #6BAF8D;
      --success-dim: rgba(107, 175, 141, 0.12);
      --danger: #f87171;
      --danger-hover: #fca5a5;
      --border: #2a2a35;
      --shadow: rgba(0, 0, 0, 0.4);
      --cat-produce: #6fbf8f;
      --cat-dairy: #7cc3e8;
      --cat-protein: #9c531c;
      --cat-spices: #ef6a5a;
      --cat-baked: #f3df72;
      --cat-household: #e88aab;
      --cat-other: var(--text-secondary);
    }

    [data-theme="light"] {
      --bg: #f5f0eb;
      --surface: #dfe3e6;
      --card: #dfe3e6;
      --card-hover: #d5d9dc;
      --input-bg: #e8eaec;
      --text: #2b1e0a;
      --text-secondary: #7a6548;
      --text-dim: #b0a898;
      --accent: #314149;
      --accent-hover: #455a64;
      --accent-dim: rgba(49, 65, 73, 0.1);
      --success: #5B8A72;
      --success-dim: rgba(91, 138, 114, 0.1);
      --danger: #e74c3c;
      --danger-hover: #c0392b;
      --border: #c9b49a;
      --shadow: rgba(0, 0, 0, 0.06);
      --cat-produce: #2e7d4f;
      --cat-dairy: #2a7fb8;
      --cat-protein: #6b3a15;
      --cat-spices: #c0392b;
      --cat-baked: #b08c1a;
      --cat-household: #c2557c;
      --cat-other: var(--text-secondary);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.4s, color 0.4s;
      padding: 0;
      margin: 0;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 20px 18px 120px;
      min-height: 100vh;
    }

    input[type="text"], input[type="password"] {
      flex: 1;
      height: 48px;
      padding: 0 16px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: all 0.25s;
    }

    input[type="text"]::placeholder, input[type="password"]::placeholder {
      color: var(--text-dim);
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    input[type="file"] { display: none; }

    button {
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ── Login Form ── */
    #login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      padding-top: 30vh;
    }

    #login-form .btn-login {
      height: 48px;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      width: 100%;
    }

    #login-form .btn-login:hover { background: var(--accent-hover); transform: scale(1.02); }
    #login-form .btn-login:active { transform: scale(0.98); }

    #login-error {
      color: var(--danger);
      text-align: center;
      font-size: 0.9rem;
    }

    #main-content { display: none; }

    /* ── Header ── */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0 2px;
      margin-bottom: 20px;
    }

    .settings-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--card);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .settings-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .settings-btn svg { width: 20px; height: 20px; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-sub {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* ── Progress Ring ── */
    .progress-wrap {
      position: relative;
      width: 46px;
      height: 46px;
      cursor: default;
      transition: opacity 0.2s ease;
    }

    .progress-ring { transform: rotate(-90deg); }

    .progress-bg {
      fill: none;
      stroke: var(--border);
      stroke-width: 3.5;
    }

    .progress-fill {
      fill: none;
      stroke: var(--success);
      stroke-width: 3.5;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .progress-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .header-count {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    /* ── Input Area ── */
    .input-area {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      position: relative;
    }

    .input-wrap {
      flex: 1;
      position: relative;
      display: flex;
      min-width: 0;
    }

    .input-wrap input {
      flex: 1;
      min-width: 0;
      width: 100%;
      padding-right: 58px;
    }

    .category-trigger {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      pointer-events: none;
    }

    .category-trigger select {
      position: absolute;
      inset: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      pointer-events: auto;
      -webkit-appearance: none;
      appearance: none;
    }

    .category-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--cat-other);
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .category-trigger svg {
      width: 11px;
      height: 11px;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .image-preview {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 0;
      margin-bottom: 8px;
      padding: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 32px var(--shadow);
    }

    .image-preview.visible { display: block; }

    .image-preview img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
    }

    .btn-image {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--card);
      color: var(--text-secondary);
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1.5px solid var(--border);
    }

    .btn-image:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .btn-add {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font-size: 22px;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-add:hover { transform: scale(1.05); filter: brightness(1.1); }
    .btn-add:active { transform: scale(0.95); }

    .btn-add svg { width: 20px; height: 20px; }

    /* ── Suggestions ── */
    .suggestions-wrapper {
      min-height: 0;
      max-height: 0;
      overflow: hidden;
      margin-bottom: 0;
      opacity: 0;
      transition: max-height 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                  margin-bottom 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .suggestions-wrapper.expanded {
      max-height: 80px;
      margin-bottom: 16px;
      opacity: 1;
    }

    .suggestions-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .suggestion-chip {
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s;
      white-space: nowrap;
    }

    .suggestion-chip:hover {
      color: var(--text);
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 14px;
      align-items: center;
      min-height: 42px;
    }

    .tabs .progress-wrap {
      margin-left: auto;
    }

    .tab {
      padding: 7px 18px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--text-secondary);
      font-family: 'DM Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s;
    }

    .tab:hover:not(.active) {
      color: var(--text);
      background: var(--card-hover);
    }

    .tab.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .category-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .cat-btn {
      padding: 5px 12px;
      border-radius: 8px;
      border: 1.5px solid var(--c, var(--cat-other));
      background: transparent;
      color: var(--c, var(--cat-other));
      font-family: 'DM Sans', sans-serif;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .cat-btn[data-cat="produce"] { --c: var(--cat-produce); }
    .cat-btn[data-cat="dairy"] { --c: var(--cat-dairy); }
    .cat-btn[data-cat="protein"] { --c: var(--cat-protein); }
    .cat-btn[data-cat="spices"] { --c: var(--cat-spices); }
    .cat-btn[data-cat="baked"] { --c: var(--cat-baked); }
    .cat-btn[data-cat="household"] { --c: var(--cat-household); }
    .cat-btn[data-cat="other"] { --c: var(--cat-other); }

    .cat-btn:hover {
      background: color-mix(in srgb, var(--c) 12%, transparent);
    }

    .cat-btn.active {
      background: color-mix(in srgb, var(--c) 22%, transparent);
      border-color: var(--c);
    }

    /* ── Sections ── */
    .section { margin-bottom: 1.25rem; }
    .section.hidden { display: none; }

    /* ── Todo Item ── */
    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--card);
      border-radius: 12px;
      margin-bottom: 6px;
      border: 1px solid var(--border);
      contain: layout;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .todo-item:hover {
      background: var(--card-hover);
      border-color: var(--text-dim);
    }

    .todo-item.cat-produce { --c: var(--cat-produce); }
    .todo-item.cat-dairy { --c: var(--cat-dairy); }
    .todo-item.cat-protein { --c: var(--cat-protein); }
    .todo-item.cat-spices { --c: var(--cat-spices); }
    .todo-item.cat-baked { --c: var(--cat-baked); }
    .todo-item.cat-household { --c: var(--cat-household); }

    .todo-item[class*="cat-"]:not(.cat-other) {
      background: color-mix(in srgb, var(--c) 22%, var(--card));
      border: 1.5px solid var(--c);
    }

    .todo-item[class*="cat-"]:not(.cat-other):hover {
      background: color-mix(in srgb, var(--c) 30%, var(--card));
      border-color: var(--c);
    }

    .todo-item[class*="cat-"]:not(.cat-other) .task-text {
      color: var(--c);
    }

    .todo-item[class*="cat-"]:not(.cat-other).staged .task-text {
      color: var(--text-secondary);
    }

    #pantrySection .todo-item[class*="cat-"]:not(.cat-other).completed .task-text {
      color: var(--c);
    }

    .todo-item.optimistic {
      opacity: 0.6;
      animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .todo-item.completed {
      opacity: 0.55;
    }

    .todo-item.completed:hover {
      opacity: 0.7;
    }

    .todo-item.staged {
      opacity: 0.55;
    }

    .todo-item.staged .task-text {
      color: var(--text-secondary);
      text-decoration: line-through;
      text-decoration-color: var(--text-dim);
    }

    .todo-item.staged:hover {
      opacity: 0.7;
    }

    .task-container {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .task-text {
      cursor: pointer;
      user-select: none;
      flex: 1;
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.35;
      transition: color 0.25s;
      padding: 12px 0;
    }

    .completed .task-text {
      color: var(--text-secondary);
      text-decoration: line-through;
      text-decoration-color: var(--text-dim);
    }

    #pantrySection .todo-item.completed {
      opacity: 1;
    }

    #pantrySection .completed .task-text {
      text-decoration: none;
      color: var(--text);
    }

    /* ── Mini Image ── */
    .mini-img-skeleton {
      width: 44px;
      height: 44px;
      background: linear-gradient(90deg, var(--border) 25%, var(--surface) 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 10px;
      flex-shrink: 0;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .mini-img {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .mini-img.loading { display: none; }

    /* ── Item Menu Button ── */
    .menu-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: transparent;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      opacity: 0;
      transition: all 0.2s;
    }

    .menu-btn svg {
      width: 16px;
      height: 16px;
    }

    .todo-item:hover .menu-btn { opacity: 1; }

    .menu-btn:hover {
      background: var(--card-hover);
      color: var(--text-secondary);
    }

    @media (hover: none) {
      .menu-btn { opacity: 0.5; }
    }

    /* ── Item Menu ── */
    .item-menu {
      display: none;
      position: fixed;
      z-index: 1100;
      min-width: 160px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 12px 40px var(--shadow);
      padding: 6px;
      flex-direction: column;
    }

    .item-menu.open { display: flex; }

    .item-menu-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 500;
      text-align: left;
      transition: all 0.15s;
    }

    .item-menu-btn:hover { background: var(--card-hover); }

    .item-menu-btn.danger { color: var(--danger); }
    .item-menu-btn.danger:hover { background: rgba(248, 113, 113, 0.1); }

    /* ── Edit Row ── */
    .edit-form {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .edit-form .edit-input {
      flex: 1;
      min-width: 0;
      height: 38px;
      padding: 0 58px 0 14px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14.5px;
      outline: none;
    }

    .edit-form .edit-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .edit-save {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .edit-save:hover { filter: brightness(1.1); }

    .edit-save svg { width: 16px; height: 16px; }

    /* ── Loading Indicator ── */
    .loading-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-secondary);
      font-size: 0.875rem;
      padding: 12px 14px;
      background: var(--card);
      border-radius: 12px;
      margin-bottom: 6px;
      border: 1px solid var(--border);
      opacity: 0.8;
    }

    .loading-indicator.hidden { display: none; }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty State ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      animation: fadeIn 0.5s ease;
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: var(--card);
      border: 1.5px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
    }

    .empty-icon svg { width: 28px; height: 28px; }

    .empty-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 17px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .empty-sub {
      font-size: 13px;
      color: var(--text-dim);
    }

    /* ── Move to Pantry ── */
    .move-to-pantry-wrap {
      text-align: center;
      padding-top: 12px;
      animation: fadeIn 0.3s ease;
    }

    .move-to-pantry-btn {
      padding: 8px 20px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .move-to-pantry-btn:hover {
      border-color: #b8860b;
      color: #b8860b;
      background: rgba(184, 134, 11, 0.06);
      box-shadow: 0 0 12px rgba(184, 134, 11, 0.15);
    }

    /* ── Image Modal ── */
    #image-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }

    #modal-img {
      max-width: 94%;
      max-height: 94%;
      border-radius: 12px;
      object-fit: contain;
    }

    /* ── Settings Overlay ── */
    .settings-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 900;
    }

    .settings-overlay.open { display: block; }

    /* ── Settings Panel ── */
    .settings-panel {
      position: fixed;
      top: 0;
      right: -320px;
      width: 300px;
      height: 100%;
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 950;
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    .settings-panel.open { right: 0; }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
    }

    .settings-close {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .settings-close:hover {
      color: var(--text);
      background: var(--card-hover);
    }

    .settings-content {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.95rem;
      font-weight: 500;
    }

    /* ── Toggle Switch ── */
    .toggle {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: var(--border);
      border-radius: 24px;
      transition: 0.25s;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.25s;
    }

    .toggle input:checked + .toggle-slider {
      background: var(--accent);
    }

    .toggle input:checked + .toggle-slider::before {
      transform: translateX(20px);
    }

    /* ── Clear Pantry Button ── */
    .clear-pantry-btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }

    .clear-pantry-btn:hover {
      border-color: #dc3c3c;
      color: #dc3c3c;
      background: rgba(220, 60, 60, 0.06);
    }

    /* ── Toast ── */
    .toast-container {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      pointer-events: none;
    }

    .toast {
      padding: 10px 22px;
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 32px var(--shadow);
      transform: translateY(16px);
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: auto;
    }

    .toast.show { transform: translateY(0); opacity: 1; }

    .toast-success { border-color: var(--success); }

    .toast-success::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      margin-right: 8px;
      vertical-align: middle;
    }

    /* ── Animations ── */
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(5px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(3px); }
    }

    /* ── Reduced Motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.05ms !important;
      }
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      .container {
        padding: 16px 14px 100px;
      }

      .input-area {
        gap: 8px;
      }

      input[type="text"], input[type="password"] {
        height: 44px;
        font-size: 16px;
      }

      .btn-image, .btn-add {
        width: 44px;
        height: 44px;
      }

      .todo-item {
        padding: 12px 14px;
      }

      .task-text {
        padding: 12px 0;
      }

      .settings-panel {
        width: 280px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="login-form">
      <input type="password" id="passwordInput" placeholder="Enter password to unlock" autofocus />
      <button class="btn-login" onclick="login()">Unlock</button>
      <div id="login-error"></div>
    </div>

    <div id="main-content">
      <header class="app-header">
        <button class="settings-btn" onclick="toggleSettings()" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="5" cy="12" r="2"/>
            <circle cx="12" cy="12" r="2"/>
            <circle cx="19" cy="12" r="2"/>
          </svg>
        </button>
        <div class="header-right" id="headerRight">
          <div class="progress-wrap" id="progressWrap" title="Shopping progress">
            <svg class="progress-ring" width="46" height="46" viewBox="0 0 46 46">
              <circle class="progress-bg" cx="23" cy="23" r="19" />
              <circle class="progress-fill" id="progress-fill" cx="23" cy="23" r="19"
                stroke-dasharray="119.38" stroke-dashoffset="119.38" />
            </svg>

      <div class="input-area">

        <button class="btn-image" title="Add photo" onclick="document.getElementById('imageInput').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="20" height="20">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </button>
        <input type="file" id="imageInput" accept="image/*" />
        <div class="input-wrap">
          <input type="text" id="itemInput" placeholder="What do we need?" autocomplete="off" autofocus />
          <div class="category-trigger">
            <span class="category-dot" id="categoryDot"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

            <select id="categorySelect" aria-label="Choose category">
              <option value="produce">Produce</option>
              <option value="dairy">Dairy</option>
              <option value="protein">Protein</option>
              <option value="spices">Spices</option>
              <option value="baked">Baked</option>
              <option value="household">Household</option>
              <option value="other" selected>Other</option>
            </select>
          </div>
        </div>
        <button class="btn-add" id="addButton" onclick="addItem()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>

      <div class="suggestions-wrapper">
        <div id="suggestionsBox" class="suggestions-container"></div>

      <div class="tabs" id="tabsBar">
        <button class="tab active" onclick="switchTab('buy')">To Buy</button>
        <button class="tab" onclick="switchTab('pantry')">Pantry</button>
      </div>

      <div class="category-tabs" id="categoryTabs">
        <button class="cat-btn" data-cat="produce">Produce</button>
        <button class="cat-btn" data-cat="dairy">Dairy</button>
        <button class="cat-btn" data-cat="protein">Protein</button>
        <button class="cat-btn" data-cat="spices">Spices</button>
        <button class="cat-btn" data-cat="baked">Baked</button>
        <button class="cat-btn" data-cat="household">Household</button>
        <button class="cat-btn" data-cat="other">Other</button>
      </div>

      <div class="section" id="buySection">
        <div id="loadingIndicator" class="loading-indicator hidden">
          <div class="spinner"></div>
          <span id="loadingText">Adding item...</span>
        </div>
        <div id="activeList"></div>
      </div>

      <div class="move-to-pantry-wrap" id="moveToPantryWrap" style="display:none">
        <button class="move-to-pantry-btn" id="moveToPantryBtn" onclick="moveStagedToPantry()">
          Move items to pantry
        </button>
      </div>

      <div class="section hidden" id="pantrySection">
        <div id="pantryList"></div>
      </div>
    </div>
  </div>

  <div id="image-modal" onclick="closeModal()">
    <img id="modal-img" alt="Enlarged item image" />
  </div>

  <div class="settings-overlay" id="settingsOverlay" onclick="toggleSettings()"></div>
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-header">
      <span>Settings</span>
      <button class="settings-close" onclick="toggleSettings()">&times;</button>
    </div>
    <div class="settings-content">
      <button class="clear-pantry-btn" id="clearPantryBtn" onclick="clearPantry()">Clear Pantry Items</button>
      <div class="setting-row">
        <span>Light Theme</span>
        <label class="toggle">
          <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <div class="item-menu" id="itemMenu" role="menu">
    <button class="item-menu-btn" id="menuEdit" role="menuitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="15" height="15">
        <path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>
      </svg>
      Edit
    </button>
    <button class="item-menu-btn" id="menuMove" role="menuitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
        <path d="M9 3h6M10 3v6l-5 7a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-7V3"/>
      </svg>
      Move to pantry
    </button>
    <button class="item-menu-btn danger" id="menuDelete" role="menuitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
        <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
      </svg>
      Delete
    </button>
  </div>

  <script>
    const SUPABASE_URL = 'https://hpdokobntovytsgylpra.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_k80QkmztNinOHWyj6n_-tg_l8tdeTRp';
    const SHARED_EMAIL = 'lalithsa@gmail.com';

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        storageKey: 'ShoppingListSession',
      }
    });

    const activeList = document.getElementById('activeList');
    const pantryList = document.getElementById('pantryList');
    const itemInput = document.getElementById('itemInput');
    const imageInput = document.getElementById('imageInput');
    const modal = document.getElementById('image-modal');
    const modalImg = document.getElementById('modal-img');
    const passwordInput = document.getElementById('passwordInput');
    const loginError = document.getElementById('login-error');
    const loginForm = document.getElementById('login-form');
    const mainContent = document.getElementById('main-content');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const loadingText = document.getElementById('loadingText');
    const buySection = document.getElementById('buySection');
    const pantrySection = document.getElementById('pantrySection');
    const tabsBar = document.getElementById('tabsBar');
    const tabs = document.querySelectorAll('.tab');
    const settingsOverlay = document.getElementById('settingsOverlay');
    const settingsPanel = document.getElementById('settingsPanel');
    const themeToggle = document.getElementById('themeToggle');
    const clearPantryBtn = document.getElementById('clearPantryBtn');
    const moveToPantryWrap = document.getElementById('moveToPantryWrap');
    const moveToPantryBtn = document.getElementById('moveToPantryBtn');
    const progressFill = document.getElementById('progress-fill');
    const progressLabel = document.getElementById('progress-label');
    const toastContainer = document.getElementById('toast-container');
    const progressWrap = document.getElementById('progressWrap');
    const headerRight = document.getElementById('headerRight');
    const categorySelect = document.getElementById('categorySelect');
    const categoryDot = document.getElementById('categoryDot');
    const categoryTabs = document.getElementById('categoryTabs');
    const itemMenu = document.getElementById('itemMenu');
    const menuEdit = document.getElementById('menuEdit');
    const menuMove = document.getElementById('menuMove');
    const menuDelete = document.getElementById('menuDelete');

    const CIRC = 2 * Math.PI * 19;

    let selectedImageFile = null;
    let subscription = null;
    let isAdding = false;
    let itemsCache = [];
    let activeTab = 'buy';
    let selectedCategory = 'other';
    let activeCategory = null;
    let editingId = null;

    let realtimeTimeout = null;

    let settings = {
      theme: 'dark'
    };

    function loadSettings() {
      try {
        const saved = localStorage.getItem('shoppingListSettings');
        if (saved) settings = { ...settings, ...JSON.parse(saved) };
      } catch (e) {}
    }

    function saveSettings() {
      localStorage.setItem('shoppingListSettings', JSON.stringify(settings));
    }

    function applySettings() {
      document.documentElement.setAttribute('data-theme', settings.theme);
      themeToggle.checked = settings.theme === 'light';

      tabsBar.style.display = 'flex';
      clearPantryBtn.style.display = 'block';
      if (progressWrap.parentNode !== tabsBar) {
        tabsBar.appendChild(progressWrap);
      }
      switchTab(activeTab);
      updateProgress();
    }

    function toggleSettings() {
      const isOpen = settingsOverlay.classList.contains('open');
      settingsOverlay.classList.toggle('open', !isOpen);
      settingsPanel.classList.toggle('open', !isOpen);
    }

    function toggleTheme() {
      settings.theme = themeToggle.checked ? 'light' : 'dark';
      saveSettings();
      applySettings();
    }

    async function clearPantry() {
      if (!confirm("Clear all pantry items?")) return;
      const originalItems = [...itemsCache];
      const pantryItems = itemsCache.filter(item => item.is_completed);
      itemsCache = itemsCache.filter(item => !item.is_completed);
      renderItems(itemsCache);
      fetchAndRenderSuggestions();

      if (pantryItems.length === 0) return;

      const imageUrls = pantryItems.filter(item => item.image_url).map(item => item.image_url);
      if (imageUrls.length > 0) {
        await Promise.all(imageUrls.map(async (imageUrl) => {
          try {
            const url = new URL(imageUrl);
            const filePath = url.pathname.split('/public/item-images/')[1] || '';
            if (filePath) await client.storage.from('item-images').remove([filePath]);
          } catch (e) {}
        }));
      }

      const { error } = await client.from('shopping_items').delete().eq('is_completed', true);
      if (error) {
        itemsCache = originalItems;
        renderItems(itemsCache);
        fetchAndRenderSuggestions();
        alert("Failed to clear pantry items.");
      } else {
        showToast('Pantry cleared', 'success');
      }
    }

    function switchTab(tab) {
      activeTab = tab;
      closeItemMenu();
      cancelEdit();
      tabs.forEach(t => t.classList.remove('active'));
      if (tab === 'buy') {
        tabs[0].classList.add('active');
        buySection.classList.remove('hidden');
        pantrySection.classList.add('hidden');
      } else {
        tabs[1].classList.add('active');
        buySection.classList.add('hidden');
        pantrySection.classList.remove('hidden');
      }
      fetchAndRenderSuggestions();
      updateMoveButton();
      updateProgress();
    }

    function sanitizeHTML(str) {
      if (str === null || str === undefined) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function validateImageUrl(url) {
      if (!url) return '';
      try {
        const parsed = new URL(url);
        if (parsed.protocol === 'https:' || parsed.protocol === 'blob:') return url;
      } catch (e) {}
      return '';
    }

    function generateTempId() {
      return 'temp-' + crypto.randomUUID();
    }

    function updateProgress() {
      if (activeTab !== 'buy') {
        progressWrap.style.visibility = 'hidden';
        progressWrap.style.opacity = '0';
        progressWrap.style.pointerEvents = 'none';
        return;
      }
      progressWrap.style.visibility = '';
      progressWrap.style.opacity = '';
      progressWrap.style.pointerEvents = '';
      const active = itemsCache.filter(i => !i.is_completed);
      const staged = active.filter(i => i.is_staged).length;
      const total = active.length;
      const pct = total === 0 ? 100 : Math.round((staged / total) * 100);
      progressFill.style.strokeDashoffset = CIRC * (1 - (total === 0 ? 0 : staged / total));
      progressLabel.textContent = pct + '%';
    }

    function showToast(message, type) {
      const toast = document.createElement('div');
      toast.className = 'toast' + (type === 'success' ? ' toast-success' : '');
      toast.textContent = message;
      toastContainer.appendChild(toast);

      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          toast.classList.add('show');
        });
      });

      setTimeout(function() {
        toast.classList.remove('show');
        setTimeout(function() { toast.remove(); }, 350);
      }, 2600);
    }

    async function toggleStaged(id) {
      const idx = itemsCache.findIndex(i => i.id === id);
      if (idx === -1) return;
      const next = !itemsCache[idx].is_staged;
      itemsCache[idx].is_staged = next;
      renderItems(itemsCache);
      updateMoveButton();
      updateProgress();
      const { error } = await client.from('shopping_items').update({ is_staged: next }).eq('id', id);
      if (error) {
        itemsCache[idx].is_staged = !next;
        renderItems(itemsCache);
        updateMoveButton();
        updateProgress();
      }
    }

    function updateMoveButton() {
      const count = itemsCache.filter(i => !i.is_completed && i.is_staged).length;
      if (count > 0 && activeTab === 'buy') {
        moveToPantryWrap.style.display = 'block';
        moveToPantryBtn.textContent = 'Move ' + count + ' item' + (count !== 1 ? 's' : '') + ' to pantry';
      } else {
        moveToPantryWrap.style.display = 'none';
      }
    }

    async function moveStagedToPantry() {
      var staged = itemsCache.filter(i => !i.is_completed && i.is_staged);
      var count = staged.length;
      if (!confirm('Move ' + count + ' item' + (count !== 1 ? 's' : '') + ' to pantry?')) return;

      for (var i = 0; i < staged.length; i++) {
        var id = staged[i].id;
        await client.from('shopping_items').update({ is_completed: true, is_staged: false }).eq('id', id);
        var idx = itemsCache.findIndex(function(item) { return item.id === id; });
        if (idx !== -1) { itemsCache[idx].is_completed = true; itemsCache[idx].is_staged = false; }
      }

      renderItems(itemsCache);
      showToast('Moved to pantry', 'success');
    }

    imageInput.addEventListener('change', (e) => {
      selectedImageFile = e.target.files[0] || null;
      const preview = document.getElementById('imagePreview');
      const previewImg = document.getElementById('previewImg');
      
      if (selectedImageFile) {
        const reader = new FileReader();
        reader.onload = (e) => {
          previewImg.src = e.target.result;
          preview.classList.add('visible');
        };
        reader.readAsDataURL(selectedImageFile);
      } else {
        preview.classList.remove('visible');
        previewImg.src = '';
      }
    });

    async function checkSession() {
      const { data: { session } } = await client.auth.getSession();
      if (session) {
        loginForm.style.display = 'none';
        mainContent.style.display = 'block';
        await fetchItems();
        setupRealtime();
      } else {
        loginForm.style.display = 'flex';
        mainContent.style.display = 'none';
      }
    }

    async function login() {
      const password = passwordInput.value.trim();
      if (!password) return;

      const { data, error } = await client.auth.signInWithPassword({
        email: SHARED_EMAIL,
        password: password,
      });

      if (error) {
        loginError.textContent = 'Invalid password. Try again.';
        return;
      }

      passwordInput.value = '';
      loginError.textContent = '';
      await checkSession();
    }

    async function fetchItems() {
      const { data, error } = await client
        .from('shopping_items')
        .select('*')
        .order('created_at', { ascending: true });

      if (error) {
        return;
      }

      itemsCache = data || [];
      renderItems(itemsCache);
      fetchAndRenderSuggestions();
    }

    function handleRealtimeEvent(payload) {
      const { eventType, new: newRecord, old: oldRecord } = payload;

      switch (eventType) {
        case 'INSERT':
          itemsCache = itemsCache.filter(item => !(item.isOptimistic && item.item === newRecord.item));
          if (!itemsCache.some(item => item.id === newRecord.id)) {
            itemsCache.push(newRecord);
          }
          break;

        case 'UPDATE':
          const updateIndex = itemsCache.findIndex(item => item.id === newRecord.id);
          if (updateIndex !== -1) {
            itemsCache[updateIndex] = { ...itemsCache[updateIndex], ...newRecord };
          } else {
            itemsCache.push(newRecord);
          }
          break;

        case 'DELETE':
          itemsCache = itemsCache.filter(item => item.id !== oldRecord.id);
          break;
      }

      itemsCache.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      clearTimeout(realtimeTimeout);
      realtimeTimeout = setTimeout(() => {
        renderItems(itemsCache);
        const cached = itemsCache.find(i => i.id === newRecord.id);
        if (eventType !== 'UPDATE' || (cached && cached.item !== newRecord.item)) {
          fetchAndRenderSuggestions();
        }
      }, 100);
    }

    function renderImage(item) {
      if (!item.image_url) return '';
      
      const isOptimistic = item.isOptimistic;
      const skeletonClass = isOptimistic ? 'mini-img-skeleton' : '';
      const imgClass = isOptimistic ? 'mini-img loading' : 'mini-img';
      const onLoadHandler = isOptimistic ? 'onload="this.classList.remove(\'loading\'); this.previousElementSibling.style.display=\'none\'"' : '';
      
      const safeUrl = validateImageUrl(item.image_url);
      return (
        (isOptimistic ? '<div class="' + skeletonClass + '"></div>' : '') +
        '<img class="' + imgClass + '" src="' + sanitizeHTML(safeUrl) + '" alt="' + sanitizeHTML(item.item) + '" onclick="showImage(\'' + sanitizeHTML(safeUrl) + '\')" ' + onLoadHandler + '>'
      );
    }

    function renderItem(item, isCompleted) {
      const optimisticClass = item.isOptimistic ? 'optimistic' : '';
      const isStaged = !isCompleted && item.is_staged;
      const stagedClass = isStaged ? 'staged' : '';

      let clickAction;
      if (item.isOptimistic) {
        clickAction = '';
      } else if (!isCompleted) {
        clickAction = 'onclick="toggleStaged(\'' + sanitizeHTML(item.id) + '\')"';
      } else {
        clickAction = 'onclick="toggleItem(\'' + sanitizeHTML(item.id) + '\', ' + (!isCompleted) + ')"';
      }

      const safeUrl = validateImageUrl(item.image_url);
      const isEditing = editingId === item.id && !item.isOptimistic;
      const menuAction = item.isOptimistic ? '' : 'onclick="openItemMenu(\'' + sanitizeHTML(item.id) + '\', this, \'' + (safeUrl ? sanitizeHTML(safeUrl) : '') + '\')"';
      const ariaLabel = item.isOptimistic ? 'Adding item...' : 'Item options';

      let content;
      if (isEditing) {
        const cat = getCategory(item);
        const catOptions = ['produce', 'dairy', 'protein', 'spices', 'baked', 'household', 'other'].map(c =>
          '<option value="' + c + '"' + (c === cat ? ' selected' : '') + '>' + c.charAt(0).toUpperCase() + c.slice(1) + '</option>'
        ).join('');
        content =
          '<div class="task-container">' +
            renderImage(item) +
            '<div class="edit-form">' +
              '<div class="input-wrap">' +
                '<input class="edit-input" type="text" value="' + sanitizeHTML(item.item) + '" onkeydown="editKeyHandler(event, \'' + sanitizeHTML(item.id) + '\')">' +
                '<div class="category-trigger">' +
                  '<span class="category-dot" style="background:var(--cat-' + cat + ')"></span>' +
                  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>' +
                  '<select class="edit-cat-select" aria-label="Category">' + catOptions + '</select>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<button class="edit-save" onclick="saveEdit(\'' + sanitizeHTML(item.id) + '\')" aria-label="Save">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
          '</button>';
      } else {
        content =
          '<div class="task-container">' +
            renderImage(item) +
            '<span class="task-text" ' + clickAction + '>' + sanitizeHTML(item.item) + '</span>' +
          '</div>' +
          '<button class="menu-btn" ' + menuAction + ' aria-label="' + ariaLabel + '" ' + (item.isOptimistic ? 'disabled' : '') + '>' +
            '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>' +
          '</button>';
      }

      return (
        '<div class="todo-item cat-' + getCategory(item) + ' ' + (isCompleted ? 'completed' : '') + ' ' + stagedClass + ' ' + optimisticClass + '" data-id="' + sanitizeHTML(item.id) + '" data-image-url="' + (safeUrl ? sanitizeHTML(safeUrl) : '') + '">' +
          content +
        '</div>'
      );
    }

    function getCategory(item) {
      return item.category || 'other';
    }

    function sortByActiveCategory(list) {
      if (!activeCategory) return list;
      const cat = activeCategory;
      return [
        ...list.filter(i => getCategory(i) === cat),
        ...list.filter(i => getCategory(i) !== cat)
      ];
    }

    function sortActiveItems(list) {
      const unstaged = list.filter(i => !i.is_staged);
      const staged = list.filter(i => i.is_staged);
      return [
        ...sortByActiveCategory(unstaged),
        ...sortByActiveCategory(staged)
      ];
    }

    function renderItems(items) {
      closeItemMenu();
      const active = sortActiveItems(items.filter(i => !i.is_completed));
      const completed = sortByActiveCategory(items.filter(i => i.is_completed));

      const emptyBuyHTML =
        '<div class="empty-state">' +
          '<div class="empty-icon">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>' +
              '<line x1="3" y1="6" x2="21" y2="6"/>' +
              '<path d="M16 10a4 4 0 0 1-8 0"/>' +
            '</svg>' +
          '</div>' +
          '<p class="empty-title">Nothing on the list yet</p>' +
          '<p class="empty-sub">Type above to start your list</p>' +
        '</div>';

      const emptyPantryHTML =
        '<div class="empty-state">' +
          '<div class="empty-icon">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>' +
              '<line x1="3" y1="6" x2="21" y2="6"/>' +
              '<path d="M16 10a4 4 0 0 1-8 0"/>' +
            '</svg>' +
          '</div>' +
          '<p class="empty-title">Nothing bought yet</p>' +
          '<p class="empty-sub">Check off items to add them here</p>' +
        '</div>';

      activeList.innerHTML = active.length === 0 ? emptyBuyHTML : active.map(item => renderItem(item, false)).join('');

      const completedHTML = completed.length === 0 ? emptyPantryHTML : completed.map(item => renderItem(item, true)).join('');

      pantryList.innerHTML = completedHTML;

      updateMoveButton();

      updateProgress();
    }

    async function fetchAndRenderSuggestions() {
      const suggestionsBox = document.getElementById('suggestionsBox');
      const suggestionsWrapper = document.querySelector('.suggestions-wrapper');
      if (activeTab !== 'buy') {
        suggestionsBox.innerHTML = '';
        suggestionsWrapper.classList.remove('expanded');
        return;
      }

      suggestionsBox.innerHTML = '';

      const { data, error } = await client
        .from('item_frequency')
        .select('item_name')
        .gt('add_count', 1)
        .order('add_count', { ascending: false })
        .limit(10);

      if (error || !data || data.length === 0) {
        suggestionsBox.innerHTML = '';
        suggestionsWrapper.classList.remove('expanded');
        return;
      }

      const currentNames = new Set(itemsCache.map(i => i.item.toLowerCase()));

      const sortedSuggestions = data
        .map(row => row.item_name)
        .filter(name => !currentNames.has(name.toLowerCase()))
        .slice(0, 6);

      if (sortedSuggestions.length === 0) {
        suggestionsBox.innerHTML = '';
        suggestionsWrapper.classList.remove('expanded');
        return;
      }

      suggestionsBox.innerHTML = sortedSuggestions.map(name =>
        '<div class="suggestion-chip" data-name="' + sanitizeHTML(name) + '">' + sanitizeHTML(name) + '</div>'
      ).join('');

      suggestionsBox.querySelectorAll('.suggestion-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          addSuggestedItem(chip.dataset.name);
        });
      });

      updateSuggestionsVisibility();
    }

    function updateSuggestionsVisibility() {
      const wrapper = document.querySelector('.suggestions-wrapper');
      const hasChips = document.getElementById('suggestionsBox').children.length > 0;
      if (hasChips && document.activeElement === itemInput) {
        wrapper.classList.add('expanded');
      } else {
        wrapper.classList.remove('expanded');
      }
    }

    function addSuggestedItem(name) {
      document.getElementById('itemInput').value = name;
      addItem();
    }

    async function addItem() {
      if (isAdding) return;
      
      const text = itemInput.value.trim();
      if (!text) {
        itemInput.focus();
        itemInput.style.animation = 'none';
        itemInput.offsetHeight;
        itemInput.style.animation = 'shake 0.4s ease';
        return;
      }

      if (itemsCache.some(i => !i.is_completed && i.item.toLowerCase() === text.toLowerCase())) {
        itemInput.value = '';
        alert('Item is already on your active list.');
        return;
      }

      const pantryItem = itemsCache.find(i => i.is_completed && i.item.toLowerCase() === text.toLowerCase());
      if (pantryItem) {
        if (confirm('"' + pantryItem.item + '" is already in your pantry. Move it to your shopping list?')) {
          itemInput.value = '';
          const preview = document.getElementById('imagePreview');
          const previewImg = document.getElementById('previewImg');
          imageInput.value = '';
          selectedImageFile = null;
          preview.classList.remove('visible');
          previewImg.src = '';
          await moveItemToBuy(pantryItem.id);
        }
        return;
      }

      isAdding = true;
      const addButton = document.getElementById('addButton');
      const preview = document.getElementById('imagePreview');
      const previewImg = document.getElementById('previewImg');
      const tempImageFile = selectedImageFile;
      const tempImageUrl = tempImageFile ? URL.createObjectURL(tempImageFile) : null;
      
      addButton.disabled = true;
      addButton.innerHTML = tempImageFile
        ? '<div class="spinner" style="width:18px;height:18px;border-width:2px;border-color:rgba(255,255,255,0.3);border-top-color:#fff;"></div>'
        : '<div class="spinner" style="width:18px;height:18px;border-width:2px;border-color:rgba(255,255,255,0.3);border-top-color:#fff;"></div>';
      loadingText.textContent = tempImageFile ? 'Uploading image...' : 'Adding item...';
      loadingIndicator.classList.remove('hidden');

      const tempId = generateTempId();
      const optimisticItem = {
        id: tempId,
        item: text,
        image_url: tempImageUrl,
        category: selectedCategory,
        is_completed: false,
        created_at: new Date().toISOString(),
        isOptimistic: true,
        hasLocalImage: !!tempImageFile
      };

      itemsCache.push(optimisticItem);
      renderItems(itemsCache);
      fetchAndRenderSuggestions();

      itemInput.value = '';
      imageInput.value = '';
      selectedImageFile = null;
      preview.classList.remove('visible');
      previewImg.src = '';
      itemInput.focus();

      let imageUrl = null;

      try {
        if (tempImageFile) {
          const ext = tempImageFile.name.split('.').pop() || 'jpg';
          const fileName = crypto.randomUUID() + '.' + ext;

          const { error: uploadError } = await client.storage
            .from('item-images')
            .upload(fileName, tempImageFile);

          if (uploadError) {
            itemsCache = itemsCache.filter(item => item.id !== tempId);
            renderItems(itemsCache);
            fetchAndRenderSuggestions();
            alert("Failed to upload image. Item not added.");
            return;
          }

          const { data: urlData } = client.storage
            .from('item-images')
            .getPublicUrl(fileName);

          imageUrl = urlData.publicUrl;
        }

        const { data, error } = await client
          .from('shopping_items')
          .insert([{ item: text, image_url: imageUrl, category: selectedCategory }])
          .select()
          .single();

        if (error) {
          itemsCache = itemsCache.filter(item => item.id !== tempId);
          renderItems(itemsCache);
          fetchAndRenderSuggestions();
          alert("Failed to add item. Please try again.");
          return;
        }

        if (data && data.id) {
          itemsCache = itemsCache.filter(item => item.id !== data.id && item.id !== tempId);
          itemsCache.push(data);
          renderItems(itemsCache);
          fetchAndRenderSuggestions();
        }
      } catch (err) {
        itemsCache = itemsCache.filter(item => item.id !== tempId);
        renderItems(itemsCache);
        fetchAndRenderSuggestions();
        alert("An error occurred. Please try again.");
      } finally {
        isAdding = false;
        addButton.disabled = false;
        addButton.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
        loadingIndicator.classList.add('hidden');
        if (tempImageUrl) {
          URL.revokeObjectURL(tempImageUrl);
        }
      }
    }

    async function toggleItem(id, shouldComplete) {
      if (!shouldComplete) {
        if (!confirm('Move this item back to your shopping list?')) return;
        await moveItemToBuy(id);
        return;
      }

      const itemIndex = itemsCache.findIndex(item => item.id === id);
      if (itemIndex !== -1) {
        itemsCache[itemIndex].is_completed = shouldComplete;
        renderItems(itemsCache);
      }

      const { error } = await client
        .from('shopping_items')
        .update({ is_completed: shouldComplete })
        .eq('id', id);

      if (error) {
        if (itemIndex !== -1) {
          itemsCache[itemIndex].is_completed = !shouldComplete;
          renderItems(itemsCache);
        }
      }
    }

    async function deleteItem(id, imageUrl) {
      if (!confirm("Delete this item?")) return;

      const originalItems = [...itemsCache];
      itemsCache = itemsCache.filter(item => item.id !== id);
      const el = document.querySelector('[data-id="' + CSS.escape(id) + '"]');
      if (el) {
        el.remove();
        updateMoveButton();
        updateProgress();
        fetchAndRenderSuggestions();
      } else {
        renderItems(itemsCache);
        fetchAndRenderSuggestions();
      }

      let imageDeleted = false;

      if (imageUrl) {
        try {
          const url = new URL(imageUrl);
          const pathParts = url.pathname.split('/public/item-images/');
          const filePath = pathParts[1] || '';

          if (filePath) {
            const { error: storageErr } = await client.storage
              .from('item-images')
              .remove([filePath]);

            if (storageErr) {
            } else {
              imageDeleted = true;
            }
          }
        } catch (e) {
        }
      }

      const { error: deleteErr } = await client
        .from('shopping_items')
        .delete()
        .eq('id', id);

      if (deleteErr) {
        itemsCache = originalItems;
        renderItems(itemsCache);
        fetchAndRenderSuggestions();
        alert("Failed to delete item. Please try again.");
        return;
      }

      // ponytail: if imageUrl && !imageDeleted, storage may have orphaned images
    }

    function openItemMenu(id, btn, imageUrl) {
      itemMenu.dataset.id = id;
      itemMenu.dataset.imageUrl = imageUrl || '';
      menuMove.style.display = activeTab === 'buy' ? '' : 'none';
      itemMenu.classList.add('open');
      const rect = btn.getBoundingClientRect();
      const menuW = itemMenu.offsetWidth || 160;
      const menuH = itemMenu.offsetHeight || 110;
      let top = rect.bottom + 6;
      if (top + menuH > window.innerHeight - 8) {
        top = Math.max(8, rect.top - menuH - 6);
      }
      let left = rect.right - menuW;
      if (left < 8) left = 8;
      itemMenu.style.top = top + 'px';
      itemMenu.style.left = left + 'px';
      itemMenu.style.right = 'auto';
    }

    function closeItemMenu() {
      itemMenu.classList.remove('open');
    }

    menuEdit.addEventListener('click', () => {
      const id = itemMenu.dataset.id;
      closeItemMenu();
      startEdit(id);
    });

    menuMove.addEventListener('click', () => {
      const id = itemMenu.dataset.id;
      closeItemMenu();
      moveItemToPantry(id);
    });

    menuDelete.addEventListener('click', () => {
      const id = itemMenu.dataset.id;
      const imageUrl = itemMenu.dataset.imageUrl;
      closeItemMenu();
      deleteItem(id, imageUrl);
    });

    async function moveItemToPantry(id) {
      const idx = itemsCache.findIndex(i => i.id === id);
      if (idx === -1) return;
      const originalItems = [...itemsCache];
      itemsCache[idx].is_completed = true;
      itemsCache[idx].is_staged = false;
      renderItems(itemsCache);
      const { error } = await client
        .from('shopping_items')
        .update({ is_completed: true, is_staged: false })
        .eq('id', id);
      if (error) {
        itemsCache = originalItems;
        renderItems(itemsCache);
        alert("Failed to move item to pantry.");
      }
    }

    async function moveItemToBuy(id) {
      const idx = itemsCache.findIndex(i => i.id === id);
      if (idx === -1) return;
      const originalItems = [...itemsCache];
      itemsCache[idx].is_completed = false;
      itemsCache[idx].is_staged = false;
      renderItems(itemsCache);
      fetchAndRenderSuggestions();
      const { error } = await client
        .from('shopping_items')
        .update({ is_completed: false, is_staged: false })
        .eq('id', id);
      if (error) {
        itemsCache = originalItems;
        renderItems(itemsCache);
        fetchAndRenderSuggestions();
        alert("Failed to move item to shopping list.");
      } else {
        showToast('Moved to shopping list', 'success');
      }
    }

    function startEdit(id) {
      editingId = id;
      renderItems(itemsCache);
      const el = document.querySelector('.todo-item[data-id="' + CSS.escape(id) + '"]');
      const input = el ? el.querySelector('.edit-input') : null;
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }

    function cancelEdit() {
      if (editingId === null) return;
      editingId = null;
      renderItems(itemsCache);
    }

    function editKeyHandler(e, id) {
      if (e.key === 'Enter') {
        saveEdit(id);
      } else if (e.key === 'Escape') {
        cancelEdit();
      }
    }

    async function saveEdit(id) {
      const el = document.querySelector('.todo-item[data-id="' + CSS.escape(id) + '"]');
      if (!el) return;
      const input = el.querySelector('.edit-input');
      if (!input) return;
      const select = el.querySelector('.edit-cat-select');
      const text = input.value.trim();
      if (!text) return;
      const idx = itemsCache.findIndex(i => i.id === id);
      if (idx === -1) return;
      const originalItems = [...itemsCache];
      itemsCache[idx].item = text;
      itemsCache[idx].category = select.value;
      editingId = null;
      renderItems(itemsCache);
      const { error } = await client
        .from('shopping_items')
        .update({ item: text, category: select.value })
        .eq('id', id);
      if (error) {
        itemsCache = originalItems;
        editingId = null;
        renderItems(itemsCache);
        alert("Failed to save changes.");
      }
      fetchAndRenderSuggestions();
    }

    document.addEventListener('click', (e) => {
      if (itemMenu.classList.contains('open') && !e.target.closest('.item-menu') && !e.target.closest('.menu-btn')) {
        closeItemMenu();
      }
      if (editingId !== null && !e.target.closest('.edit-form') && !e.target.closest('.item-menu')) {
        saveEdit(editingId);
      }
    });

    window.addEventListener('scroll', closeItemMenu, true);

    document.addEventListener('change', (e) => {
      if (e.target.classList.contains('edit-cat-select')) {
        const dot = e.target.closest('.category-trigger').querySelector('.category-dot');
        dot.style.background = 'var(--cat-' + e.target.value + ')';
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && itemMenu.classList.contains('open')) {
        closeItemMenu();
      }
    });

    function showImage(url) {
      modalImg.src = url;
      modal.style.display = 'flex';
    }

    function closeModal() {
      modal.style.display = 'none';
      modalImg.src = '';
    }

    function setupRealtime() {
      if (subscription) return;

      subscription = client.channel('shopping-changes')
        .on('postgres_changes',
          { event: '*', schema: 'public', table: 'shopping_items' },
          (payload) => handleRealtimeEvent(payload)
        )
        .subscribe();
    }

    loadSettings();
    applySettings();
    checkSession();

    passwordInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') login();
    });

    itemInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') addItem();
    });

    itemInput.addEventListener('focus', () => {
      updateSuggestionsVisibility();
    });

    itemInput.addEventListener('blur', () => {
      setTimeout(() => updateSuggestionsVisibility(), 150);
    });

    categorySelect.addEventListener('change', () => {
      selectedCategory = categorySelect.value;
      categoryDot.style.background = 'var(--cat-' + selectedCategory + ')';
    });

    function updateCategoryButtons() {
      categoryTabs.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.cat === activeCategory);
      });
    }

    categoryTabs.addEventListener('click', (e) => {
      const btn = e.target.closest('.cat-btn');
      if (!btn) return;
      activeCategory = activeCategory === btn.dataset.cat ? null : btn.dataset.cat;
      updateCategoryButtons();
      renderItems(itemsCache);
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
